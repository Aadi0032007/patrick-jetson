# Install on Jetson at ~/.config/pipewire/pipewire.conf.d/patrick-echo-cancel.conf
# Requires PipeWire built with the WebRTC AEC library. No changes applied automatically.
context.modules = [
    { name = libpipewire-module-echo-cancel
      args = {
        library.name = aec/libspa-aec-webrtc
        audio.channels = 1
        capture.props = { node.name = "patrick.aec.capture" }
        source.props = { node.name = "patrick.aec.source" node.description = "Patrick Echo Cancelled Mic" }
        sink.props = { node.name = "patrick.aec.sink" node.description = "Patrick Echo Reference Speaker" }
        playback.props = { node.name = "patrick.aec.playback" }
      }
    }
]
